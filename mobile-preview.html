<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm tra giao diện điện thoại · Bóng Đá 3D</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#020a08;color:white;font-family:system-ui,sans-serif}.outer{height:100%;display:grid;place-items:center;position:relative;background:radial-gradient(ellipse at center,#162b21,#030806 68%)}.device{height:min(100vh,844px);width:min(390px,100vw);border:1px solid #92d92f;border-radius:18px;overflow:hidden;box-shadow:0 0 60px #84d44222;background:#071310}.device iframe{width:100%;height:100%;border:0;display:block}.caption{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.12em;color:#87988a;text-transform:uppercase;white-space:nowrap}
</style>
</head>
<body><div class="outer"><div class="device"><iframe src="/" title="Game bóng đá ở kích thước điện thoại"></iframe></div><div class="caption">Bản thử responsive · khung hình 390 px</div></div></body>
</html>
